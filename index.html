<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R@ys Computer Classes | Jamshedpur</title>
    <style>
        :root {
            --primary: #1a2a6c;
            --accent: #fdbb2d;
            --glass: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #0f172a; /* Dark sleek background */
            color: var(--text);
            line-height: 1.6;
        }

        /* Navbar / Logo Area */
        nav {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
        }

        .logo {
            height: 60px; /* Adjust based on your logo size */
            margin-right: 15px;
        }

        /* Banner Image Styling */
        .hero-banner {
            width: 100%;
            max-width: 1000px;
            display: block;
            margin: 20px auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid var(--accent);
        }

        header { text-align: center; padding: 20px; }

        .container {
            max-width: 900px;
            margin: 0 auto 40px auto;
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
        }

        .registration-form {
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            background: var(--accent);
            color: #1a2a6c;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 1.1rem;
        }

        footer { text-align: center; padding: 40px; opacity: 0.7; }
    </style>
</head>
<body>

<nav>
    <img src="logo.png" alt="R@ys Logo" class="logo">
    <h2 style="margin:0;">R@ys Computer Classes</h2>
</nav>

<header>
    <img src="banner.jpg" alt="R@ys Computer Classes Banner" class="hero-banner">
</header>

<div class="container">
    <h2>Apply for Admission</h2>
    <p>Join Jamshedpur's leading tech academy. Fill out the form below:</p>
    
    <div class="registration-form">
        <form action="https://formspree.io/f/roy.class.anupam.2011@gmail.com" method="POST">
            <label>Student Name</label>
            <input type="text" name="name" required>

            <label>Contact Number</label>
            <input type="tel" name="phone" required>

            <label>Course Interest</label>
            <select name="course">
                <option>School Students (6-12)</option>
                <option>BTech/MTech Practical</option>
                <option>MNC Interview Prep</option>
                <option>AI & Cyber Security</option>
            </select>

            <button type="submit">Submit Details</button>
        </form>
    </div>
</div>

<footer>
    &copy; 2026 R@ys Computer Classes | Mango, Jamshedpur
</footer>

</body>
</html>
