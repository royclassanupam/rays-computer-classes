<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R@ys Computer Classes | Register Now</title>
    <style>
        :root {
            --primary: #1a2a6c;
            --accent: #fdbb2d;
            --glass: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6;
        }

        header { padding: 50px 20px; text-align: center; background: rgba(0,0,0,0.4); }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .registration-form {
            background: rgba(0, 0, 0, 0.2);
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--accent); }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            color: #333;
            box-sizing: border-box;
        }

        button {
            background: var(--accent);
            color: #1a2a6c;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        button:hover { background: #fff; transform: scale(1.02); }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        @media (max-width: 600px) { .contact-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>R@ys Computer Classes</h1>
    <p>Empowering Students in Jamshedpur Since 2026</p>
</header>

<div class="container">
    <h2>Student Registration</h2>
    <p>Submit your details to book a demo class or join a batch.</p>
    
    <div class="registration-form">
        <form action="https://formspree.io/f/roy.class.anupam.2011@gmail.com" method="POST">
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="Student_Name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="Contact_Number" placeholder="Enter 10-digit number" required>
            </div>

            <div class="form-group">
                <label>Select Course</label>
                <select name="Interested_Course" required>
                    <option value="">-- Choose a Course --</option>
                    <option value="School 6-12">School Students (6-12)</option>
                    <option value="BTech/MTech">BTech/MTech Advanced IT</option>
                    <option value="MNC Interview">MNC Interview Prep</option>
                    <option value="AI Course">AI Course</option>
                    <option value="Cyber Security">Cyber Security</option>
                </select>
            </div>

            <div class="form-group">
                <label>Additional Message</label>
                <textarea name="Student_Message" rows="3" placeholder="Any specific questions?"></textarea>
            </div>

            <input type="text" name="_gotcha" style="display:none">

            <button type="submit">Send Registration to Email</button>
        </form>
    </div>

    <div class="contact-grid">
        <div>
            <h3>Visit Us</h3>
            <p>H.N - 16, Teachers Colony, Mango,<br>
            Dimna Road, Jamshedpur-831012</p>
        </div>
        <div>
            <h3>Call Us</h3>
            <p>Phone: <strong>7892851730</strong></p>
        </div>
    </div>
</div>

<footer>
    <p style="text-align: center; padding: 20px;">&copy; 2026 R@ys Computer Classes</p>
</footer>

</body>
</html>
